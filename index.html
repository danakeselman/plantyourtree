<!DOCTYPE html>
<html>
  <head>
    <title>Plant Web</title>
    <style>
      #map {
        height: 100vh;
        width: 100%;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .modal-content {
        background: white;
        padding: 20px 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 400px;
        width: 90%;
        position: relative;
      }

      .modal-content button,
      .modal-content input {
        margin-top: 15px;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
      }

      .modal-content button {
        background: #007bff;
        color: white;
        cursor: pointer;
      }

      .modal-content button:hover {
        background: #0056b3;
      }

      .modal-content input {
        width: 100%;
        border: 1px solid #ccc;
      }

      .close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: transparent;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #aaa;
      }

      .close-btn:hover {
        color: #333;
      }
    </style>

    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCUWr_RhCU1ADuCbwVUqXg9YLFevt4se0E&callback=initMap"
      async
      defer
    ></script>

    <script>
      let map;
      let clickedLatLng = null;

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
         center: { lat: 43.652644, lng: -79.392381 }, // grange
          zoom: 11,
          heading: 90,
          tilt: 45
        });

        map.setHeading(90);
        map.setTilt(45);
         
        loadSavedPins();

        map.addListener("click", (e) => {
          clickedLatLng = e.latLng;
          document.getElementById("commentInput").value = "";
          document.getElementById("commentModal").style.display = "flex";
        });
      }

      function saveComment() {
        const comment = document.getElementById("commentInput").value.trim();
        if (!comment || !clickedLatLng) return;

        const pin = {
          lat: clickedLatLng.lat(),
          lng: clickedLatLng.lng(),
          comment: comment
        };

        const pins = JSON.parse(localStorage.getItem("mapPins") || "[]");
        pins.push(pin);
        localStorage.setItem("mapPins", JSON.stringify(pins));

        addPinToMap(pin);

        clickedLatLng = null;
        document.getElementById("commentModal").style.display = "none";
      }

      function loadSavedPins() {
        const pins = JSON.parse(localStorage.getItem("mapPins") || "[]");
        pins.forEach(pin => addPinToMap(pin));
      }

      function addPinToMap(pin) {
        const marker = new google.maps.Marker({
          position: { lat: pin.lat, lng: pin.lng },
          map: map
        });

        const infoWindow = new google.maps.InfoWindow({
          content: `<p>${pin.comment}</p>`
        });

        marker.addListener("click", () => {
          infoWindow.open(map, marker);
        });
      }

      function closeModal(id) {
        document.getElementById(id).style.display = "none";
      }

      window.onload = function () {
        document.getElementById("welcomeModal").style.display = "flex";
      };
    </script>
  </head>

  <body>
    <!-- the welcome hello pop up window -->
    <div id="welcomeModal" class="modal-overlay">
      <div class="modal-content">
        <h2>Hello!</h2>
        <p>Click anywhere on the map to drop a pin and share the location of your favourite tree! :D</p>
        <button onclick="closeModal('welcomeModal')">Got it!</button>
      </div>
    </div>

    <!-- this the comment one -->
    <div id="commentModal" class="modal-overlay">
      <div class="modal-content">
        <button class="close-btn" onclick="closeModal('commentModal')" title="Close">&times;</button>
        <h3>Wow that's an awesome location for a tree</h3>
        <p>Thanks for participating! Answer one of the prompts : Why is this your favourite tree? What memories do you associate with it? What kind of tree is it?</p>
        <input type="text" id="commentInput" placeholder="Type your comment..." />
        <button onclick="saveComment()">Save</button>
      </div>
    </div>

    <!-- im the map -->
    <div id="map"></div>
  </body>
</html>
